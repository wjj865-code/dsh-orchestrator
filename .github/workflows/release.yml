name: release

# 打 v* tag 时跑测试并发布到 npm（带 provenance 签名）。日常 push 不发布。
#
# 一次性配置：
#   1. npm 令牌：npmjs.com → Access Tokens → Generate New Token → Granular Access Token
#      - Permissions: Read and write
#      - Packages: 选中 @wjj865-code/dsh-orchestrator
#      - 账号开了 2FA 时勾上 "Bypass two-factor authentication"（CI 无法输 OTP）
#   2. 仓库配置：Settings → Secrets and variables → Actions → New repository secret
#      Name: NPM_TOKEN    Value: 上一步的令牌
#      （这是唯一需要人工配置的密钥；不配则 Publish 步骤报 ENEEDAUTH。）
#   3. 可选、更推荐：不用长期令牌，改用 npm 的 Trusted Publishing——
#      npmjs.com → 包 → Settings → Trusted publishing → 绑定 GitHub 仓库
#      工作流文件名填 release.yml；然后在 Publish 步骤里删掉下面三行 env。
#
# 发布流程（版本号是唯一真源）：
#   npm version patch          # 或 minor / major，同时改 package.json 并建 tag
#   git push --follow-tags     # 推提交 + 推 tag vX.Y.Z → 本工作流接管
#   首次对已有版本补 tag：git tag v0.3.1 && git push origin v0.3.1（版本已在 npm 上会被下面「已在 npm 上」的步骤拦下）
#
# 发布后镜像同步：最后一步会主动 PUT npmmirror 的 syncs 接口并轮询约 3 分钟。
#   该步 continue-on-error，超时只出 warning；手动补做：npm run mirror:sync（查状态：npm run mirror:check）。
#   国内用户默认走 registry.npmmirror.com，镜像没刷出来时 npm i @latest 还拿旧版。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm publish --provenance 用 GitHub OIDC 签发行来源证明

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag 必须等于 package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json version ${version} 不一致：先 npm version 再打 tag"
            exit 1
          fi

      - name: 该版本不能已经在 npm 上
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::error::${name}@${version} 已发布过：先 npm version patch 再打新 tag（npm 不允许覆盖已发布版本）"
            exit 1
          fi

      - name: Test
        run: |
          npm test
          npm run check:client

      - name: Publish
        # prepublishOnly 会再跑一次测试，这里已经显式跑过，跳过重复生命周期。
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 触发 npmmirror 镜像同步
        # npm publish 只落 registry.npmjs.org；npmmirror 靠自己的后台回源，常常几十分钟到几小时才出现。
        # 这一步主动 PUT 一次同步请求，把「镜像有新版」从小时级压到分钟级。
        # continue-on-error：镜像同步失败不能让发布判红（npm 已经发出去了，重跑整个工作流只会卡在「已发布」拦截上）。
        continue-on-error: true
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          encoded="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "${name}")"
          echo "触发镜像同步：${name}@${version}"
          curl -sS -X PUT "https://registry.npmmirror.com/-/package/${encoded}/syncs" -w '\nHTTP %{http_code}\n'
          # 轮询等镜像刷出来（最多约 3 分钟）：只用来把结果写进日志，超时只警告不失败。
          for attempt in $(seq 1 18); do
            latest="$(npm view "${name}" dist-tags.latest --registry=https://registry.npmmirror.com 2>/dev/null || true)"
            if [ "${latest}" = "${version}" ]; then
              echo "::notice::镜像已就绪：${name}@${version}"
              exit 0
            fi
            echo "  第 ${attempt} 次轮询：镜像 latest = ${latest:-未就绪}"
            sleep 10
          done
          echo "::warning::镜像尚未出现 ${name}@${version}，npmmirror 会继续后台同步；稍后用 npm run mirror:check 复查（或 node scripts/mirror-sync.mjs）"
