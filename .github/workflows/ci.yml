name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 不传 version：pnpm/action-setup@v4 会读 package.json 的 packageManager（pnpm@x.y.z），
        # 让「本地跑的 pnpm 版本」与 CI 保持同一个真源，避免两处版本号漂移。
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 缓存 pnpm 的 content-addressable store（cache key 由 pnpm-lock.yaml 哈希决定）。
          # 需要 pnpm 先上 PATH，所以必须排在 Setup pnpm 之后。
          cache: pnpm

      - name: Install dependencies
        # pnpm test 先跑 pretest → `vite build`（vite 是 devDependency），不装依赖会 `vite: not found`（exit 127）。
        # 仓库提交 pnpm-lock.yaml，所以用 --frozen-lockfile：锁文件与 package.json 不一致时直接失败，CI 里不悄悄改依赖树。
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        # README / CHANGELOG / package.json 三处版本漂移过一次（README 停在 0.19.1），发版前用断言挡住。
        shell: bash
        run: node scripts/check-version.mjs

      - name: Docs budget & consistency
        # 文档行数预算（README + docs 顶层 ≤2250）+ README 配置表/工具表与代码一致 + 包内文档与内链可达。
        # pretest 也会跑一遍（本地 `pnpm test` 同样挡住），这里单独一步让 CI 红点直接指向文档。
        shell: bash
        run: node scripts/check-docs.mjs

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.txt
          pnpm run check:client

      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          grep -E '^(not ok|# tests|# pass|# fail)|AssertionError|Error:' test-output.txt \
            | head -80 \
            | while IFS= read -r line; do
                echo "::error title=test::${line}"
              done
