- insert:
    - id: orchestrator
      name: '@wjj865-code/dsh-orchestrator'
    - id: orchestrator-coordinator-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-orchestrator-coordinator
        name: 协调者
        description: 协调与原生自动化管理：拆任务、派子会话、看回报、交付产物；可只读看单个文件（read），不搜索、不写文件、不执行命令。
        order: 80
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是 dsh-orchestrator 的协调者，只做协调：拆任务、派子会话、看回报，用 present 交付子会话产物；可以只读看单个文件（read），但不搜索、不枚举目录，也不写文件、不执行命令。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          # B（0.26.0）：协调者只读工具面。tool-fs 只开 read —— write / edit / apply_patch / read_image
          # 全部关掉，协调者工具表里**没有写工具**；写仍由钉死的 read-only 权限预设（沙箱写全拒）兜底。
          # t-4f7ce108：**不挂 tool-fs-search**。该包（@deepseek-ai/dsh-tool-fs-search）的 Config 只有
          # sampleOverCapGlobResults 与各 max* 上限，glob/grep 在 apply() 里**无条件一起注册**，没有按工具
          # 开关；而 preset-tools 的 deny 只作用于「已注册的全局工具」（restrict 遮不到预设自有行），
          # 遮不住它。所以只能整行移除：协调者拿到 read，没有 glob/grep——否则主会话会自己搜索文件、
          # 绕过派发自行调研（用户原话）。检索/枚举类工作走 task_create 派只读任务。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
              applyPatch: false
          # A（0.26.0）：grill-me 技能。注册模块读包内 skills/grill-me/SKILL.md，注册进**本预设作用域**
          # （只对协调者可见；worker 预设不挂这个模块，子会话看不到）。tool-skill 提供模型面 skill({name})
          # 与技能目录（目录随会话注入、只含 name+description，正文按需加载）—— 它和下面的
          # skill-filesystem 都挂在本预设里，目录才会把「随包技能 + 本地技能」一起注入。
          - id: skill-grill-me
            name: '@wjj865-code/dsh-orchestrator/skill-grill-me'
          # 0.35.0（P0，用户拍板「P0 协调者预设挂 skill-filesystem」）：**本地技能发现**。
          # 宿主 base 补丁把 skill-filesystem / tool-skill 都 disabled 了（web-app 补丁注释：
          # presets own local discovery），所以协调者预设不自己挂这一行，主会话技能目录里就只有
          # 宿主内置技能 + 随包的 grill-me（本机实测 8 条），看不到 ~/.agents/skills。补上它 = 主会话
          # 目录并入用户本地全局技能根（~/.agents/skills、~/.dsh/skills）与项目技能根
          # （<project>/.agents/skills、<project>/.dsh/skills）—— 主会话需要看到这些本地技能，
          # 才能判断「这项该不该派、带什么约束、要不要建议用户走某个技能」。
          # 纯行、无 config：默认根就是全部（覆盖用户 + 项目），与 worker 预设同一形态、同一位置
          # （紧贴 tool-skill 之前）。它只注册技能**来源**，不注册任何工具；不碰沙箱与审批。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # 交付：协调者用 present 把子会话产物（reports 文件）声明给客户端。
          # 与标准预设（dsh-web-app/presets/cordis.patch.yml）和 worker 预设同形。
          # present 在 web/desktop 由本预设行自己注册（own 工具，preset-tools 的遮挡式 deny 遮不到它）。
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: preset-tools
            name: '@wjj865-code/dsh-orchestrator/preset-tools'
            config:
              # 遮挡式（0.26.0 起与 worker 同形）：工具面默认全开，只点名遮「编排正确性」项。
              # 只有这些项是**协调者不该有**的：派队友/团队板会绕过 task_create 的台账与依赖编排，
              # 插件管理与密钥/IM 属于宿主运维面。写与执行不靠名单：协调者预设没挂 tool-bash/tool-pwsh，
              # tool-fs 也只开 read，写路径另有钉死的 read-only 权限预设（沙箱写全拒）兜底。
              # 另外遮住三个**角色专属**的子会话工具（task_report / task_detail / plan_save）：
              # 它们是全局工具，不遮就会出现在协调者工具表里；执行层各自还会再校验归属。
              # `working_directory` 也在这里遮：宿主全局工具会改协调者会话的 cwd，而 cwd 是指挥锚
              # （子会话继承目录、工作区/写域判定、记忆项目键推断都以它为准），看文件用 read/glob/grep
              # 的绝对路径即可。执行层 `COORDINATOR_DENY` 是同一份口径（双保险，预设层遮出生即生效）。
              deny:
                - wait_agent
                - spawn_teammate
                - send_message
                - list_agents
                - interrupt_agent
                - team_task_create
                - team_task_get
                - team_task_list
                - team_task_update
                - plugin_manager
                - request_secret
                - request_connector
                - list_bots
                - message_bot
                - post_to_group
                - create_bot
                - create_group
                - delete_group
                - update_group
                - update_bot
                - task_report
                - task_detail
                - plan_save
                - artifact_save
                # 宿主全局工具（dsh-tool-working-directory）：会改协调者会话 cwd，见上面的说明。
                - working_directory
              # 正向声明：这 7 个全局工具必须对协调者「出生即可用」；挂载后校验并写 preset.keep 审计。
              # （preset 自有工具如 present / ask_user_question / schedule_* 不受 deny 影响，不列在这里。）
              keep:
                - task_create
                - task_list
                - task_status
                - task_message
                - context
                - memory_note
                - read_workspace
                # 0.32.0：能力包工厂只对协调者开放（worker 与包会话也在 preset-tools 里 deny 掉）。
                - capability_pack
    - id: orchestrator-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-orchestrator-worker
        name: 任务执行者
        description: 子会话的完整工作栈；显式指定它，避免继承协调者预设的工具收窄。
        order: 81
        plugins:
          # task_report / task_detail / plan_save / context 是 dsh-orchestrator 插件在 host plane 注册的**全局**工具
          # （index.js 的 createTools(...).map(tool => ctx.tools.register(tool))），不是独立预设包，所以这里没有
          # 对应的「工具行」——子会话工具表里直接继承它们，preset-tools 只在下面做**点名遮挡**（不遮它们）。
          # plan_save 只在计划模式任务里被放行（普通任务/协调者调用都会被工具层拒绝）。
          # 只读的 get_goal 由下面的 tool-goal 行提供（web-app 关掉了 host plane 的同名行）。
          # persona：只留身份一句。任务执行者的静态提示（先读详情 / 执行中上报 / 交付回报 / 主动读 context /
          # 装依赖授权）已迁到 W1 per-turn policy（src/copy.js 定义句子、src/prompt-layers.js 的
          # renderWorkerPolicy 渲染、index.js 按 tasks.session_id 注册 ctx.systemPrompt.context）：
          # 出生即带的东西现在每回合重渲染，「同一句只在一层出现」由 test/prompt-layers.test.js 锁住。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是 dsh-orchestrator 的任务执行者，在目标目录里把活干完，并用 task_report 回报。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # 子会话要能读自己的任务目标（G1 把 task.goal 写进平台 goal）：
          # goals 服务留在 host plane（dsh-base 的 goal 行），web-app 只把模型面 tool-goal 行交给预设，
          # 所以预设不挂这一行时子会话没有任何 goal 工具，get_goal 无从调用。
          # 只读可用：get_goal 无权限门槛；create_goal/update_goal 需要「顶层 agent 的直接人类回合」，子会话会被拒。
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # 子会话的工具面：**遮挡式**（deny 名单），与协调者的保留式（allow 补集）不同——
          # 子会话的 bash/pwsh/fs/web/todo/skill 等工具都由本预设自有行提供（不是全局工具），
          # 用 allow 补集要把平台所有全局工具名抄全，漏一个就会把 task_report/task_detail 一起遮掉。
          # 0.29.x（2026-11-21 用户方向「子会话执行任务也能读到很多项目背景与已有实践，也需要写记忆」）：
          # 子会话也能写**项目级**记忆（note/lesson/decision，project 强制为自己任务的 target_dir、单任务 ≤3 条、
          # 来源记 worker+taskId），所以这里**不再遮 memory_note**（deny 为空 = keep-only 形态）；
          # 全局偏好（preference）与跨项目/全局记忆仍只协调者——由执行层 tools.js 按任务归属校验并拒绝。
          # keep 是正向声明：这些全局工具必须对子会话「出生即可用」；挂载后校验并写 preset.keep 审计。
          - id: preset-tools
            name: '@wjj865-code/dsh-orchestrator/preset-tools'
            config:
              # 0.32.0：能力包工厂只属于协调者；子会话与包会话都不该创建/修改包。
              deny:
                - capability_pack
              keep:
                - context
                - task_detail
                - task_report
                - memory_note
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
