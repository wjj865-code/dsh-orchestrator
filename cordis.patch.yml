- insert:
    - id: orchestrator
      name: '@wjj865-code/dsh-orchestrator'
    - id: orchestrator-coordinator-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-orchestrator-coordinator
        name: 协调者
        description: 协调与原生自动化管理：拆任务、派子会话、看回报、交付产物；可只读看文件（read/glob/grep），不写文件、不执行命令。
        order: 80
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是 dsh-orchestrator 的协调者，只做协调：拆任务、派子会话、看回报，用 present 交付子会话产物；可以只读看文件（read/glob/grep）补事实，但不写文件、不执行命令。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          # B（0.26.0）：协调者只读工具面。tool-fs 只开 read —— write / edit / apply_patch / read_image
          # 全部关掉，协调者工具表里**没有写工具**；写仍由钉死的 read-only 权限预设（沙箱写全拒）兜底。
          # glob / grep 由 tool-fs-search 提供（与 worker 预设同形，只是不采样超量结果）。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # A（0.26.0）：grill-me 技能。注册模块读包内 skills/grill-me/SKILL.md，注册进**本预设作用域**
          # （只对协调者可见；worker 预设不挂这个模块，子会话看不到）。tool-skill 提供模型面 skill({name})
          # 与首个可用技能的目录 —— 两者都挂在本预设里，目录才会随会话注入。
          - id: skill-grill-me
            name: '@wjj865-code/dsh-orchestrator/skill-grill-me'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # 交付：协调者用 present 把子会话产物（reports 文件）声明给客户端。
          # 与标准预设（dsh-web-app/presets/cordis.patch.yml）和 worker 预设同形。
          # present 在 web/desktop 由本预设行自己注册（own 工具，preset-tools 的遮挡式 deny 遮不到它）。
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: preset-tools
            name: '@wjj865-code/dsh-orchestrator/preset-tools'
            config:
              # 遮挡式（0.26.0 起与 worker 同形）：工具面默认全开，只点名遮「编排正确性」项。
              # 只有这些项是**协调者不该有**的：派队友/团队板会绕过 task_create 的台账与依赖编排，
              # 插件管理与密钥/IM 属于宿主运维面。写与执行不靠名单：协调者预设没挂 tool-bash/tool-pwsh，
              # tool-fs 也只开 read，写路径另有钉死的 read-only 权限预设（沙箱写全拒）兜底。
              # 另外遮住三个**角色专属**的子会话工具（task_report / task_detail / plan_save）：
              # 它们是全局工具，不遮就会出现在协调者工具表里；执行层各自还会再校验归属。
              # `working_directory` 也在这里遮：宿主全局工具会改协调者会话的 cwd，而 cwd 是指挥锚
              # （子会话继承目录、工作区/写域判定、记忆项目键推断都以它为准），看文件用 read/glob/grep
              # 的绝对路径即可。执行层 `COORDINATOR_DENY` 是同一份口径（双保险，预设层遮出生即生效）。
              deny:
                - wait_agent
                - spawn_teammate
                - send_message
                - list_agents
                - interrupt_agent
                - team_task_create
                - team_task_get
                - team_task_list
                - team_task_update
                - plugin_manager
                - request_secret
                - request_connector
                - list_bots
                - message_bot
                - post_to_group
                - create_bot
                - create_group
                - delete_group
                - update_group
                - update_bot
                - task_report
                - task_detail
                - plan_save
                # 宿主全局工具（dsh-tool-working-directory）：会改协调者会话 cwd，见上面的说明。
                - working_directory
              # 正向声明：这 7 个全局工具必须对协调者「出生即可用」；挂载后校验并写 preset.keep 审计。
              # （preset 自有工具如 present / ask_user_question / schedule_* 不受 deny 影响，不列在这里。）
              keep:
                - task_create
                - task_list
                - task_status
                - task_message
                - context
                - memory_note
                - read_workspace
    - id: orchestrator-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-orchestrator-worker
        name: 任务执行者
        description: 子会话的完整工作栈；显式指定它，避免继承协调者预设的工具收窄。
        order: 81
        plugins:
          # task_report / task_detail / plan_save / context 是 dsh-orchestrator 插件在 host plane 注册的**全局**工具
          # （index.js 的 createTools(...).map(tool => ctx.tools.register(tool))），不是独立预设包，所以这里没有
          # 对应的「工具行」——子会话工具表里直接继承它们，preset-tools 只在下面做**点名遮挡**（不遮它们）。
          # plan_save 只在计划模式任务里被放行（普通任务/协调者调用都会被工具层拒绝）。
          # 只读的 get_goal 由下面的 tool-goal 行提供（web-app 关掉了 host plane 的同名行）。
          # persona：子会话的静态行为期望（主动读上下文）写在这里，不靠协调者每条 brief 临时注入；
          # 句子真源是 src/prompt-layers.js 的 WORKER_CONTEXT_HINT（test/prompt-layers.test.js 逐字校验）。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '你是 dsh-orchestrator 的任务执行者，在目标目录里把活干完，并用 task_report 回报。需要历史经验/项目背景时主动调 context（mode 取 history / project / workspaces，只读）：查本项目经验要显式传 project:<你的 target_dir 或工作区名>（不传只查 global 跨项目记忆），不要等协调者注入；写记忆只属协调者，要沉淀的结论写进 task_report 的 summary。'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # 子会话要能读自己的任务目标（G1 把 task.goal 写进平台 goal）：
          # goals 服务留在 host plane（dsh-base 的 goal 行），web-app 只把模型面 tool-goal 行交给预设，
          # 所以预设不挂这一行时子会话没有任何 goal 工具，get_goal 无从调用。
          # 只读可用：get_goal 无权限门槛；create_goal/update_goal 需要「顶层 agent 的直接人类回合」，子会话会被拒。
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # 子会话的工具面：**遮挡式**（deny 名单），与协调者的保留式（allow 补集）不同——
          # 子会话的 bash/pwsh/fs/web/todo/skill 等工具都由本预设自有行提供（不是全局工具），
          # 用 allow 补集要把平台所有全局工具名抄全，漏一个就会把 task_report/task_detail 一起遮掉。
          # 这里只遮写记忆：memory_note 仍只属主会话（执行层 tools.js 另有只读兜底与拒绝理由）。
          # keep 是正向声明：这些全局工具必须对子会话「出生即可用」；挂载后校验并写 preset.keep 审计。
          - id: preset-tools
            name: '@wjj865-code/dsh-orchestrator/preset-tools'
            config:
              deny:
                - memory_note
              keep:
                - context
                - task_detail
                - task_report
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
